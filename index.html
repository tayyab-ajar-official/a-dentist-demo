<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dr. Tayyab Hussain Dental Clinic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=Mrs+Saint+Delafield&display=swap">
<style>
/* Layout: white page, text left and tall arched portrait right; services as a card grid; each service opens its own page with pricing and booking. */
:root {
  --bg: #FFFFFF;
  --ink: #0A1D37;
  --ink-2: #4B5B73;
  --line: #E2E8F0;
  --soft: #F4F8FB;
  --teal: #0E8F8A;
  --teal-deep: #0A6B67;
  --teal-tint: #E6F5F4;
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --sign: 'Mrs Saint Delafield', 'Segoe Script', 'Brush Script MT', cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: auto; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.6 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; border-radius: 6px; }
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; padding-block: 18px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--display); font-weight: 600; font-size: 1.15rem; }
.brand svg { width: 30px; height: 30px; flex: none; }
.nav { display: flex; align-items: center; gap: 6px 22px; flex-wrap: wrap; font-size: .95rem; font-weight: 600; }
.nav a { text-decoration: none; color: var(--ink-2); padding: 8px 2px; }
.nav a:hover { color: var(--teal-deep); }
.nav .tel { color: var(--teal-deep); font-variant-numeric: tabular-nums; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 26px; border-radius: 999px; font: 700 1rem var(--body); text-decoration: none; border: 1.5px solid transparent; cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
.btn.primary { background: var(--teal-deep); color: #fff; }
.btn.primary:hover { background: var(--ink); }
.btn.ghost { border-color: var(--ink); color: var(--ink); background: #fff; }
.btn.ghost:hover { background: var(--ink); color: #fff; }
.btn.small { min-height: 40px; padding: 0 16px; font-size: .9rem; }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 40px; align-items: center; padding-block: clamp(32px, 6vw, 72px); }
.eyebrow { margin: 0; font-size: .8rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--teal-deep); }
.docname { margin: 6px 0 0; font-family: var(--display); font-weight: 500; font-size: clamp(1.25rem, 3vw, 1.6rem); color: var(--ink-2); }
.hero h1 { margin: 18px 0 0; display: flex; flex-direction: column; font-family: var(--display); font-weight: 600; line-height: .98; letter-spacing: -.02em; text-wrap: balance; }
.place-sub { font-size: clamp(1.3rem, 3.6vw, 2rem); font-weight: 500; color: var(--ink-2); letter-spacing: 0; }
.place { font-size: clamp(3rem, 10.5vw, 7rem); color: var(--ink); overflow-wrap: anywhere; }
.lead { margin: 22px 0 0; max-width: 46ch; font-size: 1.125rem; color: var(--ink-2); }
.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }

.portrait { position: relative; margin: 0; padding: 0 22px 22px 0; width: min(100%, 460px); justify-self: center; }
.portrait::before { content: ""; position: absolute; inset: 22px 0 0 22px; background: var(--teal-tint); border-radius: 230px 230px 30px 30px; }
.portrait img { position: relative; display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 10%; border-radius: 230px 230px 30px 30px; background: var(--soft); }
.sigcard { position: absolute; left: 14px; bottom: 0; display: flex; flex-direction: column; gap: 0; padding: 12px 22px 12px; background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 14px 34px -16px rgba(10, 29, 55, .35); }
.sigcard .sig { font-family: var(--sign); font-size: 2.6rem; line-height: 1; color: var(--ink); white-space: nowrap; }
.sigcard .cap { margin-top: 2px; border-top: 1px solid var(--line); padding-top: 6px; font-size: .72rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); }

/* Facts strip */
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-block: 1px solid var(--line); }
.fact { padding: 22px 20px; display: flex; flex-direction: column; gap: 2px; }
.fact + .fact { border-left: 1px solid var(--line); }
.fact strong { font-family: var(--display); font-weight: 600; font-size: 1.35rem; }
.fact span { font-size: .92rem; color: var(--ink-2); }

/* Sections */
.section { padding-block: clamp(48px, 8vw, 88px); }
.section-head { max-width: 60ch; margin-bottom: 32px; }
.section-head h2, .h2 { margin: 8px 0 0; font-family: var(--display); font-weight: 600; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.08; letter-spacing: -.015em; text-wrap: balance; }
.section-head p { margin: 12px 0 0; color: var(--ink-2); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.card { display: flex; flex-direction: column; gap: 10px; min-width: 0; padding: 24px; border: 1px solid var(--line); border-radius: 18px; background: #fff; text-decoration: none; color: inherit; transition: border-color .2s, box-shadow .2s, transform .2s; }
.card:hover { border-color: var(--teal); box-shadow: 0 16px 36px -18px rgba(10, 29, 55, .3); transform: translateY(-2px); }
.card h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.3rem; line-height: 1.2; }
.card p { margin: 0; color: var(--ink-2); font-size: .98rem; }
.card .price { margin-top: 4px; font-weight: 700; color: var(--teal-deep); font-variant-numeric: tabular-nums; }
.card .more { margin-top: auto; padding-top: 10px; font-size: .92rem; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .card, .btn { transition: none; } .card:hover { transform: none; } }

/* Booking */
.booking { background: var(--soft); border-radius: 28px; padding: clamp(24px, 5vw, 56px); display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 40px; align-items: start; }
.contact { margin-top: 24px; padding: 18px 20px; background: #fff; border: 1px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; gap: 10px; }
.contact .label { font-size: .75rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-2); }
.contact .num { font-family: var(--display); font-weight: 600; font-size: 1.8rem; font-variant-numeric: tabular-nums; user-select: all; }
.contact .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.form { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: clamp(20px, 3.5vw, 32px); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: .85rem; font-weight: 700; color: var(--ink); }
.field input, .field select, .field textarea { width: 100%; min-height: 48px; padding: 10px 14px; border: 1px solid #C9D3E0; border-radius: 12px; background: #fff; color: var(--ink); font: 500 16px/1.4 var(--body); }
.field textarea { min-height: 92px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 3px solid var(--teal-tint); border-color: var(--teal); }
.form .btn { width: 100%; }
.note { margin: 0; font-size: .85rem; color: var(--ink-2); }
.result { grid-column: 1 / -1; padding: 18px 20px; border-radius: 14px; background: var(--teal-tint); border: 1px solid #BFE5E2; display: flex; flex-direction: column; gap: 12px; }
.result pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 500 .92rem/1.55 var(--body); color: var(--ink); }
.result strong { font-family: var(--display); font-size: 1.15rem; }

/* Service page */
.crumb { display: inline-flex; align-items: center; gap: 6px; margin-top: 28px; font-weight: 700; font-size: .92rem; color: var(--teal-deep); text-decoration: none; padding: 8px 0; }
.crumb:hover { text-decoration: underline; }
.svc-hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .9fr); gap: 40px; align-items: start; padding-block: 16px clamp(40px, 7vw, 72px); }
.svc-hero h1 { margin: 10px 0 0; font-family: var(--display); font-weight: 600; font-size: clamp(2.4rem, 7vw, 4.4rem); line-height: 1.02; letter-spacing: -.02em; text-wrap: balance; }
.pricebox { border: 1px solid var(--line); border-radius: 20px; padding: 8px 24px; background: #fff; box-shadow: 0 18px 40px -26px rgba(10, 29, 55, .35); }
.pricebox .head { padding: 16px 0 6px; font-size: .75rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-2); }
.prow { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; padding: 16px 0; }
.prow + .prow { border-top: 1px solid var(--line); }
.prow span { color: var(--ink-2); font-weight: 600; }
.prow b { font-family: var(--display); font-weight: 600; font-size: 1.5rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.pricebox .note { padding: 6px 0 16px; }
.others { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.chip { padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; text-decoration: none; font-size: .92rem; font-weight: 600; color: var(--ink-2); }
.chip:hover { border-color: var(--teal); color: var(--teal-deep); }

/* Footer */
.foot { margin-top: clamp(48px, 8vw, 88px); padding-block: 32px 40px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px 32px; }
.foot .sig { font-family: var(--sign); font-size: 2.4rem; line-height: 1; }
.foot p { margin: 0; color: var(--ink-2); font-size: .92rem; }

@media (max-width: 820px) {
  .hero, .svc-hero, .booking { grid-template-columns: minmax(0, 1fr); gap: 32px; }
  .portrait { order: -1; width: min(100%, 380px); }
  .facts { grid-template-columns: minmax(0, 1fr); }
  .fact + .fact { border-left: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 520px) {
  .form { grid-template-columns: minmax(0, 1fr); }
  .top { padding-block: 14px; }
  .sigcard .sig { font-size: 2.2rem; }
}

/* Premium motion system */
@keyframes fadeUp { from { opacity:0; transform:translate3d(0,24px,0); } to { opacity:1; transform:translate3d(0,0,0); } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes slideInLeft { from { opacity:0; transform:translateX(-34px); } to { opacity:1; transform:translateX(0); } }
@keyframes slideInRight { from { opacity:0; transform:translateX(34px); } to { opacity:1; transform:translateX(0); } }
@keyframes softZoom { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:scale(1); } }
@keyframes signatureDraw { from { opacity:0; clip-path:inset(0 100% 0 0); } to { opacity:1; clip-path:inset(0 0 0 0); } }
@keyframes floatSoft { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
body { overflow-x:hidden; }
.top { animation:fadeIn .7s ease both; }
.brand, .nav a { transition:color .25s ease, transform .25s ease; }
.nav a:hover { transform:translateY(-2px); }
.btn { transition:transform .28s ease, box-shadow .28s ease, background .25s ease, color .25s ease; }
.btn:hover { transform:translateY(-3px); box-shadow:0 12px 24px -14px rgba(10,29,55,.55); }
.portrait { animation:slideInRight .9s cubic-bezier(.2,.75,.25,1) both; }
.portrait img { transition:transform .7s ease, filter .7s ease; }
.portrait:hover img { transform:scale(1.025); filter:saturate(1.08); }
.sigcard .sig, .foot .sig { display:inline-block; animation:signatureDraw 1.5s ease .45s both; }
.fact { transition:background .3s ease, transform .3s ease; }
.fact:hover { background:var(--teal-tint); transform:translateY(-3px); }
.card { overflow:hidden; }
.card::after { content:""; display:block; height:3px; width:0; background:var(--teal); transition:width .35s ease; }
.card:hover::after { width:100%; }
.svc-hero .pricebox { animation:slideInRight .8s ease both; }
.svc-hero > div:first-child { animation:slideInLeft .8s ease both; }
.booking { position:relative; overflow:hidden; }
.booking::before { content:""; position:absolute; width:240px; height:240px; border-radius:50%; right:-100px; top:-110px; background:rgba(14,143,138,.07); pointer-events:none; }
.field input, .field select, .field textarea { transition:border-color .25s ease, box-shadow .25s ease, transform .25s ease; }
.field input:focus, .field select:focus, .field textarea:focus { box-shadow:0 0 0 4px rgba(14,143,138,.10); transform:translateY(-1px); }
.reveal { opacity:0; transform:translateY(24px); transition:opacity .75s ease, transform .75s cubic-bezier(.2,.7,.2,1); }
.reveal.is-visible { opacity:1; transform:translateY(0); }
.reveal-left { opacity:0; transform:translateX(-28px); transition:opacity .75s ease, transform .75s ease; }
.reveal-right { opacity:0; transform:translateX(28px); transition:opacity .75s ease, transform .75s ease; }
.reveal-left.is-visible, .reveal-right.is-visible { opacity:1; transform:translateX(0); }
.service-photo, .appointment-photo { width:100%; display:block; object-fit:cover; border-radius:22px; background:var(--teal-tint); box-shadow:0 20px 44px -28px rgba(10,29,55,.5); }
.service-photo { aspect-ratio:16/10; margin-top:22px; }
.appointment-visual { display:grid; grid-template-columns:1fr; gap:16px; margin-top:22px; }
.appointment-photo { aspect-ratio:16/9; }
.image-caption { color:var(--ink-2); font-size:.9rem; margin:0; }
.page-enter { animation:fadeUp .55s ease both; }
@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; transition-duration:.01ms !important; }
  .reveal,.reveal-left,.reveal-right { opacity:1; transform:none; }
}

</style>
</head>

      '<div class="fact"><strong>9 Services</strong><span>From checkups to implants</span></div>' +
      '<div class="fact"><strong>Prices in PKR</strong><span>Estimated price ranges shown</span></div>' +

    '<section class="section" id="services" aria-labelledby="svc-title">' +
      '<div class="section-head"><p class="eyebrow">Services &amp; Pricing</p><h2 id="svc-title">Which Dental Service Do You Need?</h2>' +
      '<p>Select a service to view its estimated pricing and appointment options.</p></div>' +
      '<div class="grid">' + cards + '</div>' +
    '</section>' +
    bookingHTML('');

  function serviceView(s) {
    var rows = s.rows.map(function (r) {
      return '<div class="prow"><span>' + esc(r[0]) + '</span><b>' + esc(r[1]) + '</b></div>';
    }).join('');
    var others = services.filter(function (o) { return o.slug !== s.slug; }).map(function (o) {
      return '<a class="chip" href="#service-' + o.slug + '">' + esc(o.name) + '</a>';
    }).join('');
    return '' +
    '<a class="crumb" href="#services">&larr; All Services</a>' +
    '<section class="svc-hero">' +
      '<div>' +
        '<p class="eyebrow">Dr. Tayyab Hussain &middot; Dentist</p>' +
        '<h1>' + esc(s.name) + '</h1>' +
        '<p class="lead">' + esc(s.desc) + '</p>' +
        '<img class="service-photo" src="' + esc(s.image) + '" alt="' + esc(s.name) + ' dental care">' +
        '<div class="cta"><a class="btn primary" href="#booking-top" id="to-book">Book This Service</a></div>' +
      '</div>' +
      '<div class="pricebox"><div class="head">Pricing</div>' + rows +
        '<p class="note">These are estimated price ranges. The final cost will be confirmed by the clinic after an examination.</p></div>' +
    '</section>' +
    bookingHTML(s.slug) +
    '<section class="section" aria-labelledby="oth-title">' +
      '<h2 class="h2" id="oth-title" style="font-size:1.6rem">Other Services</h2>' +
      '<div class="others">' + others + '</div>' +
    '</section>';
  }

  function whenText(v) {
    var p = v.split('-');
    if (p.length !== 3) return v;
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function wireBooking() {
    var form = document.getElementById('book-form');
    if (!form) return;
    var dateEl = document.getElementById('f-date');
    var t = new Date();
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    dateEl.min = t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());

    var copyBtn = document.getElementById('copy-num');
    var copyMsg = document.getElementById('copy-msg');
    copyBtn.addEventListener('click', function () {
      var ok = function () { copyMsg.textContent = 'Phone number copied'; };
      var fail = function () {
        var r = document.createRange();
        r.selectNodeContents(document.querySelector('.contact .num'));
        var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        copyMsg.textContent = 'Phone number selected. Copy it.';
      };
      try {
        navigator.clipboard.writeText(PHONE.replace(/\s/g, '')).then(ok, fail);
      } catch (e) { fail(); }
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var name = document.getElementById('f-name');
      var phone = document.getElementById('f-phone');
      var bad = [name, phone, dateEl].filter(function (el) { return !el.value.trim(); })[0];
      if (bad) { bad.focus(); if (bad.reportValidity) bad.reportValidity(); return; }
      var svc = document.getElementById('f-service').value || 'Not decided yet';
      var msg = document.getElementById('f-msg').value.trim();
      var lines = [
        'Hello Dr. Tayyab Hussain,',
        'I would like to book an appointment.',
        'Name: ' + name.value.trim(),
        'Phone: ' + phone.value.trim(),
        'Service: ' + svc,
        'Date: ' + whenText(dateEl.value),
        'Time: ' + document.getElementById('f-time').value
      ];
      if (msg) lines.push('Message: ' + msg);
      var text = lines.join('\n');
      var res = document.getElementById('result');
      res.innerHTML = '<strong>Your message is ready</strong><pre>' + esc(text) + '</pre>' +
        '<a class="btn primary" target="_blank" rel="noopener" href="https://wa.me/' + WA + '?text=' + encodeURIComponent(text) + '">Open WhatsApp and Send</a>' +
        '<p class="note">Your message has not been sent yet. It will reach the clinic only after you tap Send in WhatsApp.</p>';
      res.hidden = false;
      res.scrollIntoView({ block: 'nearest' });
    });
  }

  function scrollToId(id) {
    var el = document.getElementById(id);
    if (el) el.scrollIntoView({ block: 'start' });
  }


  function initMotion() {
    var selectors = 'main section, .section-head, .card, .fact, .booking, .contact, .form, .pricebox, .crumb, .others, .cta, .portrait, .svc-hero h1, .svc-hero .lead';
    var nodes = Array.prototype.slice.call(document.querySelectorAll('#app ' + selectors));
    nodes.forEach(function (el, i) {
      if (el.classList.contains('card') || el.classList.contains('fact')) el.classList.add('reveal');
      else if (i % 3 === 1) el.classList.add('reveal-left');
      else if (i % 3 === 2) el.classList.add('reveal-right');
      else el.classList.add('reveal');
      if (el.classList.contains('card')) el.style.transitionDelay = (Math.min(i % 6, 5) * 75) + 'ms';
    });
    var observer;
    if ('IntersectionObserver' in window) {
      observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -35px 0px' });
      nodes.forEach(function (el) { observer.observe(el); });
    } else {
      nodes.forEach(function (el) { el.classList.add('is-visible'); });
    }
  }

  function route() {
    var h = (location.hash || '').replace(/^#/, '');
    var app = document.getElementById('app');
    var svc = null;
    if (h.indexOf('service-') === 0) {
      var slug = h.slice(8);
      svc = services.filter(function (s) { return s.slug === slug; })[0] || null;
    }
    if (svc) {
      app.innerHTML = serviceView(svc);
      app.classList.add('page-enter');
      wireBooking();
      initMotion();
      var go = document.getElementById('to-book');
      if (go) go.addEventListener('click', function (ev) { ev.preventDefault(); scrollToId('booking'); });
      window.scrollTo(0, 0);
    } else {
      app.innerHTML = homeView();
      app.classList.add('page-enter');
      wireBooking();
      initMotion();
      if (h === 'services') scrollToId('services');
      else if (h === 'book') scrollToId('booking');
      else window.scrollTo(0, 0);
    }
  }

  window.addEventListener('hashchange', route);
  route();
})();
</script>
